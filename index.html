<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quinn.fm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="site-head">
    <div>
      <h1 class="serif">quinn.fm</h1>
    </div>
    <div class="head-meta">
      <button class="btn btn-accent" id="add-btn" hidden>+ Add a track</button>
    </div>
  </header>

  <section class="carousel" id="carousel" hidden>
    <button class="nav-btn" id="prev-btn" aria-label="Previous track">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>

    <div id="carousel-slot"></div>

    <button class="nav-btn" id="next-btn" aria-label="Next track">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </section>

  <div class="carousel-dots" id="carousel-dots"></div>

  <div class="empty" id="empty-state" hidden>
    <h2 class="serif">Nothing spinning yet</h2>
    <p>Add the first track to start your rotation.</p>
  </div>
</div>

<dialog id="track-dialog">
  <form class="dialog-inner" id="track-form" method="dialog">
    <h2 class="serif" id="dialog-title">Add a track</h2>
    <div class="dialog-sub" id="dialog-sub">Search Apple Music's catalog and pick a match.</div>

    <div id="search-step">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search a song or artist&hellip;" autocomplete="off">
      </div>
      <div class="search-status" id="search-status"></div>
      <div class="search-results" id="search-results"></div>
      <button type="button" class="manual-toggle" id="manual-toggle-on">Can't find it &mdash; enter it manually</button>
    </div>

    <div id="picked-step" hidden>
      <div class="picked-card">
        <div class="picked-art" id="picked-art"></div>
        <div class="picked-info">
          <div class="p-title" id="picked-title"></div>
          <div class="p-artist" id="picked-artist"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="picked-change">Change</button>
      </div>
    </div>

    <input type="hidden" id="f-id">
    <input type="hidden" id="f-url">
    <input type="hidden" id="f-art-url">

    <div id="manual-fields" class="manual-fields" hidden>
      <div class="field">
        <label for="f-title">Song title</label>
        <input type="text" id="f-title" maxlength="120" placeholder="e.g. Nightcall">
      </div>
      <div class="field">
        <label for="f-artist">Artist</label>
        <input type="text" id="f-artist" maxlength="120" placeholder="e.g. Kavinsky">
      </div>
      <div class="field">
        <label for="f-manual-url">Apple Music link</label>
        <input type="url" id="f-manual-url" placeholder="https://music.apple.com/...">
      </div>
    </div>

    <div class="field" id="note-field" hidden>
      <label for="f-note">Why it's on repeat</label>
      <textarea id="f-note" rows="2" maxlength="220" placeholder="One line on what's got you hooked"></textarea>
    </div>

    <div class="dialog-actions" id="dialog-actions" hidden>
      <button type="button" class="btn btn-ghost" id="dialog-cancel">Cancel</button>
      <div class="right">
        <button type="submit" class="btn btn-accent" id="dialog-submit">Save track</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
